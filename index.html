<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPS Computers & Printers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Noto Sans Tamil', sans-serif; }
    .notification-card { border-left: 4px solid #f59e0b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white px-4 py-4 shadow">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-extrabold">VPS கம்ப்யூட்டர்ஸ் & பிரிண்டர்ஸ்</h1>
        <p class="text-sm text-slate-300">அரசு சேவைகள் • டிக்கெட் புக்கிங் • பிரிண்டிங்</p>
      </div>
      <button class="bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-xl">தமிழ்</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <section class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-900 px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
          <h2 class="font-black text-lg">🔔 புதிய அறிவிப்புகள் & ஆன்லைன் லிங்க்ஸ்</h2>
        </div>
        <span class="bg-slate-900 text-amber-300 text-[10px] font-black px-2 py-1 rounded-full">LIVE UPDATES</span>
      </div>
      <div id="notification-list" class="p-4 space-y-3 bg-slate-50"></div>
    </section>
  </main>

  <script>
    const notificationsData = [
      {
        tagTa: 'புதியது',
        tagEn: 'NEW',
        titleTa: 'TNPSC குரூப் 4 (VAO) தேர்வு – 6,574 காலிப்பணியிடங்கள் available now.',
        titleEn: 'TNPSC Group 4 (VAO) Exam – 6,574 vacancies available now.',
        actionType: 'page',
        actionTarget: 'tnpsc',
        linkTextTa: '🔗 விண்ணப்பிக்க',
        linkTextEn: '🔗 Apply Now'
      },
      {
        tagTa: 'பான் கார்டு',
        tagEn: 'PAN CARD',
        titleTa: 'புதிய பான் கார்டு (New PAN Card), பான் திருத்தம் மற்றும் ஆதார்-பான் இணைப்பு சேவைகள்.',
        titleEn: 'New PAN Card, PAN Correction and Aadhaar-PAN Linking services.',
        actionType: 'page',
        actionTarget: 'idcards',
        linkTextTa: '🪪 பான் கார்டு பக்கம்',
        linkTextEn: '🪪 Open PAN Tab'
      },
      {
        tagTa: 'திருப்பதி TTD',
        tagEn: 'TTD',
        titleTa: 'திருப்பதி தேவஸ்தானம் (TTD) தரிசன நேரம், டிக்கெட் புக் செய்தல் மற்றும் அங்கீகரிக்கப்பட்ட சேவைகள்.',
        titleEn: 'Tirupati TTD darshan and ticket booking updates and assistance services.',
        actionType: 'page',
        actionTarget: 'ttd',
        linkTextTa: '🛕 TTD பக்கம்',
        linkTextEn: '🛕 Open TTD Page'
      },
      {
        tagTa: 'பிரிண்டிங்',
        tagEn: 'CARDS',
        titleTa: 'திருமண அழைப்பிதழ் மாடல்கள் (Wedding Cards) மற்றும் தொழில்முறை பிரிண்டிங் சேவைகள்.',
        titleEn: 'Wedding card invitation designs and professional printing services.',
        actionType: 'page',
        actionTarget: 'printing',
        linkTextTa: '💌 படங்கள் பார்க்க',
        linkTextEn: '💌 View Designs'
      },
      {
        tagTa: 'டிக்கெட்',
        tagEn: 'TRAVEL',
        titleTa: 'பஸ் / ரயில் / விமான டிக்கெட் புக்கிங் மற்றும் Tatkal உதவி.',
        titleEn: 'Bus / train / flight ticket booking and Tatkal support.',
        actionType: 'page',
        actionTarget: 'tickets',
        linkTextTa: '✈️ டிக்கெட் பக்கம்',
        linkTextEn: '✈️ Book Tickets'
      }
    ];

    const listEl = document.getElementById('notification-list');
    listEl.innerHTML = notificationsData.map(item => `
      <div class="notification-card bg-white rounded-xl p-4 shadow-sm border border-amber-100">
        <div class="flex items-center justify-between gap-3 mb-2">
          <span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-1 rounded-full uppercase">${item.tagTa}</span>
          <span class="bg-slate-200 text-slate-700 text-[10px] font-bold px-2 py-1 rounded-full uppercase">${item.tagEn}</span>
        </div>
        <p class="text-sm text-slate-700 leading-relaxed">${item.titleTa}</p>
        <button class="mt-3 inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-2 rounded-lg">${item.linkTextTa}</button>
      </div>
    `).join('');
  </script>
</body>
</html>
